name: NxHeal CI

on:
  push:
    branches:
      - main
      - feat/mvp-foundation
  pull_request:
    branches:
      - main
      - feat/mvp-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript checks and production build
        run: npm run build

      - name: Run automated tests
        run: npm test
